name: tests

# F-13: minimal CI harness. Runs the core-logic test suite (db, persistence,
# idempotency, sandbox, terminal, toolmaker, telegram_send, dreaming) on
# every push and PR. Deliberately does NOT install the full requirements.txt
# (PySide6, playwright+browsers, whisper) — those need system-level deps
# (Qt libs, browser binaries) that would make this slow and flaky for what
# is currently a backend-logic test suite. Beyond stdlib, tests/ needs
# `requests`, `pyenchant` (spellcheck), and `python-telegram-bot` (Telegram
# bridge) — keep this list in sync with tests/ imports as coverage grows,
# this is a hand-maintained subset of requirements.txt, not the real thing.
# A GUI/integration tier can be added later if the test suite grows to
# actually need PySide6.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libenchant-2-2

      - name: Install test dependencies
        run: pip install pytest==9.1.1 requests==2.34.2 platformdirs pyenchant==3.3.0 python-telegram-bot==22.8

      - name: Run tests (the real gate)
        run: python -m pytest tests/ -v -m "not castle_walls_evidence"

      # CASTLE-WALLS-CLOSURE-01 CI-COLLECTION-REPAIR -- tests/conftest.py's
      # pytest_collection_modifyitems has tagged tests/test_castle_walls_
      # adversarial_c*.py's frozen historical evidence corpus with this
      # marker since CASTLE-WALLS-REPAIR-01, and every repair commit since
      # has reported "pytest tests/ -m 'not castle_walls_evidence'" as ITS
      # OWN real-gate number precisely because that corpus is preserved
      # byte-for-byte and its assertions are EXPECTED to start failing, one
      # by one, as each underlying vulnerability gets repaired -- that flip
      # is the proof a fix landed, not a broken build (see conftest.py's
      # own docstring). This step never actually existed here: the step
      # above ran unfiltered, so CI's own pass/fail status never matched
      # the gate every commit message has been citing. Run separately,
      # non-blocking (continue-on-error), so its expected reds are visible
      # in the log without ever turning the required check red.
      - name: Run frozen Castle Walls evidence corpus (reported separately, non-blocking)
        continue-on-error: true
        run: python -m pytest tests/ -v -m castle_walls_evidence

  # CASTLE-WALLS-BLOCKING-COVERAGE-01B -- the smallest GUI tier the top comment
  # anticipates. The `test` job above never installs PySide6, so every
  # Qt-dependent test SKIPS there. That is fine for ordinary GUI tests but not
  # for security guards: tests/test_castle_walls_repaired_wiring_01.py's Qt
  # layer drives the real LuminaWindow drop/submit handlers and the real
  # AgentWorker.run() handoff (dropped-file bytes must stay FILE_CONTENT data,
  # never become owner-authored text), and tests/test_vision_multi_image_01.py
  # pins the typed-extension drop half of the same R1A repair. The `test` job
  # already runs the Qt-free layer of that guard. Only PySide6 is added (pinned
  # as in requirements.txt), run headless. LUMINA_REQUIRE_QT=1 makes a missing
  # PySide6 fail the guard file instead of skipping, and the preflight step
  # fails the job if Qt cannot start.
  qt-security-guards:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      LUMINA_REQUIRE_QT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (enchant + headless Qt runtime libraries)
        run: sudo apt-get update && sudo apt-get install -y libenchant-2-2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install test dependencies plus PySide6
        run: pip install pytest==9.1.1 requests==2.34.2 platformdirs pyenchant==3.3.0 python-telegram-bot==22.8 PySide6==6.11.1

      - name: Preflight -- Qt must start headless (fail, never skip)
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt', app.platformName())"

      - name: Run Qt-bound Castle Walls guards (blocking)
        run: python -m pytest tests/test_castle_walls_repaired_wiring_01.py tests/test_vision_multi_image_01.py -v -rs -m "not castle_walls_evidence"
