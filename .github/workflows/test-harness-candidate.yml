name: test-harness-candidate

# Manual qualification. The required tests workflow remains authoritative.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUMINA_TEST_RESULTS: ${{ runner.temp }}/lumina-test-results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Linux containment and headless Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libenchant-2-2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo systemctl start "user@$(id -u).service"
          test -S "/run/user/$(id -u)/bus"

      - name: Install test dependencies
        run: pip install pytest==9.1.1 requests==2.34.2 platformdirs==4.10.0 pyenchant==3.3.0 python-telegram-bot==22.8 PySide6==6.11.1 PyJWT==2.8.0 cryptography==46.0.5

      - name: Reconcile the maintained inventory
        run: scripts/lumina-test --results "$LUMINA_TEST_RESULTS" list

      - name: Run bounded developer smoke
        run: scripts/lumina-test --results "$LUMINA_TEST_RESULTS" smoke

      - name: Qualify a Qt shard containing Castle Walls regression guards
        run: scripts/lumina-test --results "$LUMINA_TEST_RESULTS" --profile qt shard 8

      - name: Upload candidate receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-test-receipts
          path: ${{ env.LUMINA_TEST_RESULTS }}
          if-no-files-found: warn
          retention-days: 7
